name: Build

# Every push and pull request: check the code, then build installers for each
# platform and attach them to the run as artifacts. The release workflow calls
# this same file with a version to stamp into the app.
on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_call:
    inputs:
      version:
        description: Version to stamp into the app (e.g. 1.2.3). Empty keeps package.json's.
        type: string
        default: ""
      ref:
        description: Commit to build.
        type: string
        default: ""
      sign_mac:
        description: Sign and notarize the macOS build (needs the release-signing environment).
        type: boolean
        default: false

concurrency:
  group: build-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' && !inputs.version }}

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, test, build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:web
      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: apps/web/dist
          if-no-files-found: error

  package:
    name: Package (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --win --x64
          - name: Linux x64
            os: ubuntu-latest
            args: --linux --x64
          - name: Linux arm64
            os: ubuntu-24.04-arm
            args: --linux --arm64
            system_fpm: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Stamp version
        if: inputs.version != ''
        run: node scripts/version.mjs set "${{ inputs.version }}"
      - name: Install fpm (arm64 Linux has no prebuilt one)
        if: matrix.system_fpm
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm
          sudo gem install --no-document fpm
      - name: Build installers
        working-directory: apps/desktop
        shell: bash
        env:
          USE_SYSTEM_FPM: ${{ matrix.system_fpm && 'true' || '' }}
          # Builds are unsigned for now; don't go looking for certificates.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          pnpm build
          pnpm exec electron-builder --config electron-builder.config.cjs ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: frameloader-${{ matrix.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error

  # macOS is its own job so release builds can run inside the protected
  # release-signing environment (approval required, v* tags only), which holds
  # the Developer ID certificate and the notarization key. Pushes and pull
  # requests never touch it and produce ad-hoc signed builds.
  package-mac:
    name: Package (macOS${{ inputs.sign_mac && ', signed' || '' }})
    needs: check
    runs-on: macos-latest
    environment: ${{ inputs.sign_mac && 'release-signing' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Stamp version
        if: inputs.version != ''
        run: node scripts/version.mjs set "${{ inputs.version }}"
      - name: Prepare notarization key
        if: inputs.sign_mac
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ -z "$APPLE_API_KEY_CONTENT" ]; then
            echo "::error::release-signing secrets are missing. See README → Signing."
            exit 1
          fi
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/notary.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
      - name: Build installers
        working-directory: apps/desktop
        env:
          # Present only in the release-signing environment; empty otherwise (ad-hoc build).
          CSC_LINK: ${{ inputs.sign_mac && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ inputs.sign_mac && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY_ID: ${{ inputs.sign_mac && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ inputs.sign_mac && secrets.APPLE_API_ISSUER || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          pnpm build
          pnpm exec electron-builder --config electron-builder.config.cjs --mac --arm64 --x64 --publish never
      - name: Check signature
        if: inputs.sign_mac
        working-directory: apps/desktop
        run: |
          app="release/mac-arm64/Frameloader.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"
      - uses: actions/upload-artifact@v4
        with:
          name: frameloader-macos
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
          if-no-files-found: error
