name: Release

# Create a release in GitHub (Releases → Draft a new release) with a new tag
# like v1.2.3 on main, write the notes, and publish it. This workflow then
# builds that tag as version 1.2.3 and attaches the installers to the release.
# Nothing is pushed to main, so it works with branch protection.
on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Read version from tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Release tags must look like v1.2.3 (got \"$TAG\")."
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "Building ${TAG} as version ${BASH_REMATCH[1]}" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      ref: refs/tags/${{ github.event.release.tag_name }}

  attach:
    name: Attach installers to the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: frameloader-*
          path: dist
          merge-multiple: true
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          ls -la dist
          # --clobber so re-running a failed release replaces partial uploads.
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
